<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TLP Hub — Technology Lifecycle Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
:root{
  --bg:#FAFAF8;--surface:#fff;--surface-2:#F5F3EF;
  --border:#E8E4DC;--border-lt:#F0ECE5;
  --navy:#1C2B3A;--navy-h:#243547;--navy-a:#2D4259;
  --cream:#C8C4BC;--cream-d:#7A8A99;
  --text:#1C2B3A;--text-2:#5A6B7A;--text-3:#96A0AB;
  --accent:#D4693C;--accent-bg:#FDF1EB;
  --green:#2E7D52;--green-bg:#EAF5EF;
  --amber:#B8730D;--amber-bg:#FEF3E0;
  --red:#B03A2E;--red-bg:#FDEBEA;
  --blue:#2C5F8A;--blue-bg:#E8F0F8;
  --font-s:'Playfair Display',Georgia,serif;
  --font-b:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --sw:260px;--r:8px;--r-sm:4px;--r-lg:14px;
  --shadow:0 2px 6px rgba(28,43,58,.07),0 1px 2px rgba(28,43,58,.04);
  --shadow-lg:0 8px 24px rgba(28,43,58,.1),0 2px 6px rgba(28,43,58,.06);
}
body{font-family:var(--font-b);background:var(--bg);color:var(--text);overflow:hidden}

/* ── LAYOUT ── */
#app{display:flex;height:100vh;overflow:hidden}
#sidebar{width:var(--sw);min-width:var(--sw);background:var(--navy);display:flex;flex-direction:column;overflow-y:auto;overflow-x:hidden}
#main{flex:1;overflow-y:auto;overflow-x:hidden;background:var(--bg)}
.view{display:none;min-height:100vh}
.view.active{display:block}
.view-pad{max-width:1000px;margin:0 auto;padding:48px 44px}

/* ── SIDEBAR ── */
.brand{padding:22px 18px 18px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:11px}
.brand-logo{width:34px;height:34px;background:var(--accent);border-radius:7px;display:flex;align-items:center;justify-content:center;font-family:var(--font-s);font-weight:700;font-size:13px;color:#fff;flex-shrink:0;letter-spacing:.3px}
.brand-name{font-family:var(--font-s);font-size:15px;font-weight:600;color:#E8E4DC;line-height:1.2}
.brand-sub{font-size:9.5px;color:var(--cream-d);text-transform:uppercase;letter-spacing:.7px;margin-top:1px}
.nav{flex:1;padding:14px 10px}
.nav-label{font-size:9.5px;font-weight:600;color:var(--cream-d);text-transform:uppercase;letter-spacing:.9px;padding:12px 8px 5px;display:block}
.nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:5px;color:var(--cream);font-size:13px;font-weight:400;cursor:pointer;transition:background .14s,color .14s;user-select:none;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:var(--navy-h);color:#E8E4DC}
.nav-item.active{background:var(--navy-a);color:#fff}
.nav-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.sidebar-footer{padding:10px;border-top:1px solid rgba(255,255,255,.06)}
.sidebar-meta{text-align:center;font-size:9.5px;color:var(--cream-d);padding:7px 0 0;letter-spacing:.5px}

/* ── SEARCH ── */
.search-wrap{padding:10px 10px 6px;position:relative}
.search-input{width:100%;padding:7px 10px 7px 30px;border:1px solid rgba(255,255,255,.1);border-radius:5px;background:rgba(255,255,255,.06);color:#E8E4DC;font-family:var(--font-b);font-size:12.5px;outline:none;transition:border-color .14s,background .14s}
.search-input::placeholder{color:var(--cream-d)}
.search-input:focus{border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.1)}
.search-icon{position:absolute;left:20px;top:50%;transform:translateY(-50%);color:var(--cream-d);pointer-events:none;display:flex}
.search-results{position:absolute;left:10px;right:10px;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow-lg);max-height:340px;overflow-y:auto;z-index:100;display:none}
.search-results.open{display:block}
.search-result{padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--border-lt);transition:background .1s}
.search-result:last-child{border-bottom:none}
.search-result:hover{background:var(--surface-2)}
.search-result-text{font-size:13px;color:var(--text);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result-meta{font-size:11px;color:var(--text-3);margin-top:2px;display:flex;gap:6px}
.search-result-type{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px;padding:1px 5px;border-radius:3px;background:var(--surface-2);color:var(--text-3)}
.search-empty{padding:16px;text-align:center;font-size:13px;color:var(--text-3)}

/* ── PAGE HEADER ── */
.page-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:32px;gap:16px;flex-wrap:wrap}
.page-title{font-family:var(--font-s);font-size:26px;font-weight:700;color:var(--text);line-height:1.2}
.page-sub{font-size:13px;color:var(--text-3);margin-top:4px}
.page-actions{display:flex;gap:8px;flex-shrink:0;align-items:center;margin-top:4px}

/* ── CARDS ── */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px 28px;box-shadow:var(--shadow)}
.card+.card{margin-top:20px}
.card-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.card-title{font-family:var(--font-s);font-size:15px;font-weight:600;color:var(--text)}
.card-sub{font-size:11.5px;color:var(--text-3);margin-top:2px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:28px;align-items:start}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:20px;font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.badge-dot{width:5px;height:5px;border-radius:50%}
.b-green{background:var(--green-bg);color:var(--green)}.b-green .badge-dot{background:var(--green)}
.b-amber{background:var(--amber-bg);color:var(--amber)}.b-amber .badge-dot{background:var(--amber)}
.b-red{background:var(--red-bg);color:var(--red)}.b-red .badge-dot{background:var(--red)}
.b-blue{background:var(--blue-bg);color:var(--blue)}.b-blue .badge-dot{background:var(--blue)}
.b-gray{background:var(--surface-2);color:var(--text-2)}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-sm);font-family:var(--font-b);font-size:12.5px;font-weight:500;cursor:pointer;border:none;transition:all .14s;text-decoration:none;white-space:nowrap}
.btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:var(--navy-h)}
.btn-accent{background:var(--accent);color:#fff}.btn-accent:hover{background:#C05928}
.btn-ghost{background:transparent;color:var(--text-2);border:1px solid var(--border)}.btn-ghost:hover{background:var(--surface-2);color:var(--text)}
.btn-sm{padding:5px 10px;font-size:11.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ── PROGRESS ── */
.progress{height:5px;background:var(--border);border-radius:3px;overflow:hidden;margin-top:8px}
.progress-fill{height:100%;border-radius:3px;transition:width .5s ease}
.pf-green{background:var(--green)}.pf-amber{background:var(--amber)}.pf-red{background:var(--red)}.pf-accent{background:var(--accent)}

/* ── TASKS ── */
.task-list{list-style:none}
.task-item{display:flex;align-items:flex-start;gap:9px;padding:12px 0;border-bottom:1px solid var(--border-lt)}
.task-item:last-child{border-bottom:none}
.task-check{width:15px;height:15px;border:1.5px solid var(--border);border-radius:3px;flex-shrink:0;margin-top:2px;cursor:pointer;transition:all .14s;display:flex;align-items:center;justify-content:center;background:#fff}
.task-check.ck{background:var(--green);border-color:var(--green)}
.task-check.ck::after{content:'✓';font-size:9px;color:#fff;font-weight:700}
.task-body{flex:1;min-width:0}
.task-text{font-size:13px;color:var(--text);line-height:1.4}
.task-text.done{text-decoration:line-through;color:var(--text-3)}
.task-meta{display:flex;align-items:center;gap:8px;margin-top:3px;flex-wrap:wrap}
.task-owner{font-size:11px;color:var(--text-3)}
.task-status{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.ts-ip{color:var(--blue)}.ts-ns{color:var(--text-3)}.ts-bl{color:var(--red)}.ts-dn{color:var(--green)}
.prio-high{font-size:10px;font-weight:600;color:var(--red);text-transform:uppercase;letter-spacing:.3px}
.prio-med{font-size:10px;font-weight:600;color:var(--amber);text-transform:uppercase;letter-spacing:.3px}
.prio-low{font-size:10px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.3px}
.task-actions{display:flex;gap:4px;opacity:0;transition:opacity .14s;flex-shrink:0}
.task-item:hover .task-actions{opacity:1}
.icon-btn{width:22px;height:22px;border:none;background:none;cursor:pointer;color:var(--text-3);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:13px;transition:background .14s,color .14s}
.icon-btn:hover{background:var(--surface-2);color:var(--text)}

/* ── RISKS ── */
.risk-item{padding:14px 16px;background:var(--surface-2);border-radius:var(--r-sm);border-left:3px solid;margin-bottom:12px}
.risk-item:last-child{margin-bottom:0}
.risk-h{border-color:var(--red)}.risk-m{border-color:var(--amber)}.risk-l{border-color:var(--text-3)}
.risk-title{font-size:13px;font-weight:600;color:var(--text);margin-bottom:4px}
.risk-desc{font-size:12.5px;color:var(--text-2);line-height:1.5;margin-bottom:6px}
.risk-mit{font-size:12px;color:var(--text-3)}.risk-mit strong{color:var(--text-2)}

/* ── DECISIONS ── */
.decision-item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--border-lt)}
.decision-item:last-child{border-bottom:none}
.decision-date{font-size:11px;color:var(--text-3);white-space:nowrap;padding-top:1px;min-width:62px}
.decision-text{font-size:13px;color:var(--text);line-height:1.5}

/* ── OBJECTIVES ── */
.obj-item{display:flex;align-items:flex-start;gap:9px;padding:11px 0;border-bottom:1px solid var(--border-lt);cursor:pointer;border-radius:var(--r-sm);transition:background .12s;margin:0 -8px;padding-left:8px;padding-right:8px}
.obj-item:last-child{border-bottom:none}
.obj-item:hover{background:var(--surface-2)}
.obj-check{width:17px;height:17px;border:1.5px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:1px;cursor:pointer;transition:all .14s;display:flex;align-items:center;justify-content:center;background:#fff}
.obj-check.ck{background:var(--green);border-color:var(--green)}
.obj-check.ck::after{content:'✓';font-size:9px;color:#fff;font-weight:700}
.obj-body{flex:1;min-width:0}
.obj-text{font-size:13px;color:var(--text);line-height:1.4}
.obj-text.done{text-decoration:line-through;color:var(--text-3)}
.obj-meta{display:flex;align-items:center;gap:8px;margin-top:4px}
.obj-meta-count{font-size:10.5px;color:var(--text-3);display:flex;align-items:center;gap:3px}
.obj-arrow{color:var(--text-3);flex-shrink:0;transition:transform .14s}
.obj-item:hover .obj-arrow{transform:translateX(2px);color:var(--text-2)}

/* ── BREADCRUMB ── */
.breadcrumb{display:flex;align-items:center;gap:6px;margin-bottom:20px;font-size:13px}
.breadcrumb-link{color:var(--text-2);cursor:pointer;text-decoration:none;transition:color .14s;background:none;border:none;font-family:var(--font-b);font-size:13px;padding:0}
.breadcrumb-link:hover{color:var(--accent)}
.breadcrumb-sep{color:var(--text-3);font-size:11px}
.breadcrumb-current{color:var(--text);font-weight:500}
.back-btn{display:inline-flex;align-items:center;gap:5px;color:var(--text-2);font-size:13px;cursor:pointer;background:none;border:none;font-family:var(--font-b);padding:4px 0;transition:color .14s;margin-bottom:8px}
.back-btn:hover{color:var(--accent)}

/* ── INIT HEADER ── */
.init-header{display:flex;flex-direction:column;gap:10px;margin-bottom:34px;padding-bottom:28px;border-bottom:1px solid var(--border)}
.init-title{font-family:var(--font-s);font-size:24px;font-weight:700;color:var(--text);line-height:1.2}
.init-subtitle{font-size:13px;color:var(--text-2);margin-top:2px}
.init-meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.init-owner{font-size:12px;color:var(--text-3)}
.init-progress{display:flex;align-items:center;gap:10px}
.init-pct{font-size:12px;font-weight:600;color:var(--text-2)}

/* ── NOTES TEXTAREA ── */
.notes-area{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;font-family:var(--font-b);font-size:12.5px;color:var(--text);background:var(--bg);resize:vertical;min-height:90px;outline:none;transition:border-color .14s;line-height:1.5}
.notes-area:focus{border-color:var(--navy)}

/* ── INLINE ADD FORM ── */
.add-form{display:none;background:var(--surface-2);border:1px solid var(--border-lt);border-radius:var(--r-sm);padding:12px;margin-top:8px;gap:8px;flex-direction:column}
.add-form.open{display:flex}
.add-form input,.add-form select{border:1px solid var(--border);border-radius:var(--r-sm);padding:7px 10px;font-family:var(--font-b);font-size:12.5px;color:var(--text);background:#fff;outline:none;width:100%}
.add-form input:focus,.add-form select:focus{border-color:var(--navy)}
.add-form-row{display:flex;gap:8px}
.add-form-row>*{flex:1}
.add-form-actions{display:flex;gap:6px;justify-content:flex-end}

/* ── DASHBOARD INIT CARD ── */
.init-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:22px 24px;cursor:pointer;transition:all .18s;box-shadow:var(--shadow)}
.init-card:hover{border-color:var(--navy);transform:translateY(-1px);box-shadow:var(--shadow-lg)}
.init-card-name{font-family:var(--font-s);font-size:14.5px;font-weight:600;color:var(--text);margin:10px 0 6px;line-height:1.3}
.init-card-desc{font-size:13px;color:var(--text-2);line-height:1.5;margin-bottom:14px}
.init-card-stats{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.init-card-pct{font-size:11.5px;font-weight:600;color:var(--text-2)}

/* ── CHAT ── */
.chat-wrap{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.chat-hd{padding:22px 32px 18px;border-bottom:1px solid var(--border);background:var(--surface);flex-shrink:0}
.chat-title{font-family:var(--font-s);font-size:20px;font-weight:700}
.chat-sub{font-size:12px;color:var(--text-3);margin-top:3px}
.chat-msgs{flex:1;overflow-y:auto;padding:24px 32px;display:flex;flex-direction:column;gap:18px}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px 32px;text-align:center}
.ce-title{font-family:var(--font-s);font-size:20px;font-weight:600;color:var(--text)}
.ce-sub{font-size:13px;color:var(--text-2);max-width:380px;line-height:1.5}
.starters{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;max-width:580px}
.starter{padding:7px 13px;background:var(--surface);border:1px solid var(--border);border-radius:20px;font-size:12.5px;color:var(--text-2);cursor:pointer;transition:all .14s}
.starter:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.msg{display:flex;gap:8px;max-width:82%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.assistant{align-self:flex-start}
.msg-av{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
.msg.user .msg-av{background:var(--navy);color:#fff}
.msg.assistant .msg-av{background:var(--accent-bg);color:var(--accent)}
.msg-bub{padding:10px 13px;border-radius:var(--r);font-size:13px;line-height:1.6}
.msg.user .msg-bub{background:var(--navy);color:#fff;border-radius:var(--r) var(--r-sm) var(--r) var(--r)}
.msg.assistant .msg-bub{background:var(--surface);color:var(--text);border:1px solid var(--border);border-radius:var(--r-sm) var(--r) var(--r) var(--r)}
.msg-bub p{margin-bottom:6px}.msg-bub p:last-child{margin-bottom:0}
.msg-bub ul{padding-left:18px;margin:6px 0}
.msg-bub li{margin-bottom:3px}
.msg-bub strong{font-weight:600}
.msg-bub code{background:rgba(0,0,0,.08);padding:1px 4px;border-radius:3px;font-size:11.5px}
.msg.user .msg-bub code{background:rgba(255,255,255,.15)}
.chat-bar{padding:14px 24px;border-top:1px solid var(--border);background:var(--surface);display:flex;gap:9px;align-items:flex-end;flex-shrink:0}
.chat-input{flex:1;resize:none;border:1px solid var(--border);border-radius:var(--r);padding:9px 13px;font-family:var(--font-b);font-size:13px;color:var(--text);background:var(--bg);outline:none;max-height:110px;line-height:1.5;transition:border-color .14s}
.chat-input:focus{border-color:var(--navy)}
.chat-send{width:34px;height:34px;background:var(--navy);border:none;border-radius:var(--r-sm);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .14s;flex-shrink:0}
.chat-send:hover{background:var(--navy-h)}.chat-send:disabled{background:var(--text-3);cursor:not-allowed}
.typing-indicator{display:flex;gap:4px;padding:10px 13px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm) var(--r) var(--r) var(--r);align-self:flex-start}
.typing-dot{width:6px;height:6px;background:var(--text-3);border-radius:50%;animation:bounce 1.2s ease-in-out infinite}
.typing-dot:nth-child(1){animation-delay:0s}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}

/* ── ARTIFACTS ── */
.art-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:28px}
.art-type{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:15px;cursor:pointer;transition:all .16s}
.art-type:hover{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.art-icon{width:34px;height:34px;background:var(--accent-bg);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:16px;margin-bottom:9px}
.art-name{font-size:13px;font-weight:600;color:var(--text);margin-bottom:3px}
.art-desc{font-size:12.5px;color:var(--text-3);line-height:1.5}
.art-list-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-sm);padding:13px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
.art-list-name{font-size:13px;font-weight:500;color:var(--text)}
.art-list-meta{font-size:11px;color:var(--text-3)}

/* ── TRANSCRIPTS ── */
.drop-zone{border:2px dashed var(--border);border-radius:var(--r-lg);padding:44px 28px;text-align:center;cursor:pointer;transition:all .2s;background:var(--surface);margin-bottom:24px}
.drop-zone:hover,.drop-zone.over{border-color:var(--accent);background:var(--accent-bg)}
.dz-icon{font-size:30px;color:var(--text-3);margin-bottom:10px}
.dz-title{font-size:14.5px;font-weight:500;color:var(--text);margin-bottom:3px}
.dz-sub{font-size:12px;color:var(--text-3)}
.tx-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px 18px;margin-bottom:12px}
.tx-item-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;gap:10px}
.tx-name{font-size:13.5px;font-weight:600;color:var(--text)}
.tx-date{font-size:11px;color:var(--text-3)}
.tx-actions{display:flex;gap:6px}
.extracted-section{margin-top:12px;padding-top:12px;border-top:1px solid var(--border-lt)}

.extracted-item{display:flex;align-items:flex-start;gap:8px;padding:7px 0;border-bottom:1px solid var(--border-lt)}
.extracted-item:last-child{border-bottom:none}
.extracted-text{font-size:12.5px;color:var(--text);flex:1;line-height:1.4}
.add-to-init{display:flex;align-items:center;gap:5px}
.add-to-init select{border:1px solid var(--border);border-radius:var(--r-sm);padding:3px 7px;font-size:11px;color:var(--text-2);background:#fff;cursor:pointer;outline:none}
.add-to-init button{padding:3px 8px;font-size:11px;background:var(--navy);color:#fff;border:none;border-radius:var(--r-sm);cursor:pointer;font-family:var(--font-b);font-weight:500}

/* ── SETTINGS ── */
.settings-section{margin-bottom:28px}
.settings-title{font-family:var(--font-s);font-size:16px;font-weight:600;color:var(--text);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field select{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 12px;font-family:var(--font-b);font-size:13px;color:var(--text);background:var(--bg);outline:none;transition:border-color .14s}
.field input:focus,.field select:focus{border-color:var(--navy)}
.field-note{font-size:11.5px;color:var(--text-3);margin-top:4px;line-height:1.4}
.api-key-wrap{position:relative}
.api-key-wrap input{padding-right:42px}
.api-key-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-3);font-size:13px}

/* ── MODAL ── */
.modal-ov{position:fixed;inset:0;background:rgba(28,43,58,.45);z-index:999;display:none;align-items:center;justify-content:center;padding:24px}
.modal-ov.open{display:flex}
.modal{background:var(--surface);border-radius:var(--r-lg);max-width:700px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
.modal-hd{padding:20px 24px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-family:var(--font-s);font-size:17px;font-weight:700}
.modal-close{background:none;border:none;cursor:pointer;font-size:18px;color:var(--text-3);line-height:1;padding:2px}
.modal-body{padding:20px 24px}
.modal-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.modal-art-content{font-family:var(--font-b);font-size:12.5px;color:var(--text);line-height:1.7;white-space:pre-wrap;background:var(--surface-2);padding:16px;border-radius:var(--r-sm);border:1px solid var(--border-lt)}

/* ── TOAST ── */
.toast-wrap{position:fixed;bottom:24px;right:24px;z-index:1000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:10px 16px;border-radius:var(--r-sm);font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);animation:slideup .2s ease;pointer-events:auto}
.toast-ok{background:var(--navy);color:#fff}
.toast-err{background:var(--red);color:#fff}
.toast-info{background:var(--accent);color:#fff}
@keyframes slideup{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

/* ── FOCUS BOX ── */
.focus-box{background:linear-gradient(135deg,#1C2B3A 0%,#2D4259 100%);border-radius:var(--r);padding:22px 24px;color:#fff;margin-bottom:20px}
.focus-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.focus-title{font-family:var(--font-s);font-size:16px;font-weight:600;color:#E8E4DC}
.focus-content{font-size:13px;line-height:1.6;color:#C8C4BC}
.focus-content ul{padding-left:18px;margin-top:6px}
.focus-content li{margin-bottom:4px}
.focus-content strong{color:#fff}
.focus-gen-btn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);color:#E8E4DC;padding:6px 12px;border-radius:var(--r-sm);font-family:var(--font-b);font-size:12px;font-weight:500;cursor:pointer;transition:background .14s}
.focus-gen-btn:hover{background:rgba(255,255,255,.2)}

/* ── MISC ── */
.divider{height:1px;background:var(--border);margin:16px 0}
.empty-state{text-align:center;padding:32px 16px;color:var(--text-3)}
.empty-state p{font-size:13px;margin-top:6px}
.section-label{font-size:10.5px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px}
.flex-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mt-4{margin-top:16px}
.mt-2{margin-top:8px}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.spinner-dark{border-color:rgba(28,43,58,.2);border-top-color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-row{display:flex;align-items:center;gap:8px;color:var(--text-3);font-size:13px;padding:10px 0}

// ============================================================
// 2. STATE
// ============================================================
let S;
function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem('tlp-hub-v2') || 'null');
    if (saved) {
      S = saved;
      migrateObjectives();
    } else {
      S = JSON.parse(JSON.stringify(DEFAULTS));
    }
  } catch(e) {
    S = JSON.parse(JSON.stringify(DEFAULTS));
  }
}
function migrateObjectives() {
  const defs = JSON.parse(JSON.stringify(DEFAULTS));
  Object.entries(S.initiatives).forEach(([initId, init]) => {
    const defInit = defs.initiatives[initId];
    init.objectives.forEach(o => {
      if (!o.tasks || !o.risks || !o.decisions) {
        const defObj = defInit && defInit.objectives.find(d => d.id === o.id);
        if (!o.tasks) o.tasks = defObj ? defObj.tasks : [];
        if (!o.risks) o.risks = defObj ? defObj.risks : [];
        if (!o.decisions) o.decisions = defObj ? defObj.decisions : [];
      }
    });
  });
  if (!S.ui.objectiveView) S.ui.objectiveView = null;
  saveState();
}
function saveState() {
  try { localStorage.setItem('tlp-hub-v2', JSON.stringify(S)); } catch(e) {}
}

// ============================================================
// 3. ROUTING
// ============================================================
function navigate(view) {
  S.ui.currentView = view;
  if (S.ui.objectiveView && S.ui.objectiveView.initId !== view) {
    S.ui.objectiveView = null;
  }
  saveState();
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const el = document.getElementById('view-' + view);
  if (el) el.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => {
    n.classList.toggle('active', n.dataset.view === view);
  });
  render(view);
  document.getElementById('main').scrollTop = 0;
}

function render(view) {
  const map = {
    dashboard: renderDashboard,
    focus: renderFocus,
    sbo: () => renderInitiative('sbo'),
    reporting: () => renderInitiative('reporting'),
    zipped: () => renderInitiative('zipped'),
    assistant: renderAssistant,
    artifacts: renderArtifacts,
    transcripts: renderTranscripts,
    settings: renderSettings
  };
  if (map[view]) map[view]();
  // Update nav dots
  ['sbo','reporting','zipped'].forEach(id => {
    const dot = document.getElementById('dot-' + id);
    if (dot) dot.style.background = statusColor(S.initiatives[id].status);
  });
}

function renderObjItem(initId, o) {
  const tCount = (o.tasks||[]).length;

  if (tCount) metaParts.push(`${tCount} task${tCount>1?'s':''}`);
  if (rCount) metaParts.push(`${rCount} risk${rCount>1?'s':''}`);
  if (dCount) metaParts.push(`${dCount} decision${dCount>1?'s':''}`);
  return `<li class="obj-item" onclick="viewObjective('${initId}','${o.id}')">
    <div class="obj-check ${o.complete?'ck':''}" onclick="event.stopPropagation();toggleObjective('${initId}','${o.id}')"></div>
    <div class="obj-body">
      <span class="obj-text ${o.complete?'done':''}">${esc(o.text)}</span>
      ${metaParts.length ? `<div class="obj-meta">${metaParts.map(p => `<span class="obj-meta-count">${p}</span>`).join('<span style="color:var(--border)">·</span>')}</div>` : ''}
    </div>
    <span class="obj-arrow"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
  </li>`;
}

function renderTaskItem(initId, t) {
  const isDone = t.status === 'complete';
  const statusLabel = {
    'not-started':'Not Started','in-progress':'In Progress',
    'blocked':'Blocked','complete':'Complete'
  }[t.status] || t.status;
  const statusCls = {'not-started':'ts-ns','in-progress':'ts-ip','blocked':'ts-bl','complete':'ts-dn'}[t.status]||'';
  const prioCls = {'high':'prio-high','medium':'prio-med','low':'prio-low'}[t.priority]||'';

  return `<li class="task-item">
    <div class="task-check ${isDone?'ck':''}" onclick="toggleTask('${initId}','${t.id}')"></div>
    <div class="task-body">
      <div class="task-text ${isDone?'done':''}">${esc(t.text)}</div>
      <div class="task-meta">
        ${t.owner ? `<span class="task-owner">${esc(t.owner)}</span>` : ''}
        <span class="task-status ${statusCls}">${statusLabel}</span>
        ${t.priority ? `<span class="${prioCls}">${t.priority}</span>` : ''}
        ${t.due ? `<span style="font-size:11px;color:var(--text-3)">${t.due}</span>` : ''}

      <button class="icon-btn" onclick="editTask('${initId}','${t.id}')" title="Edit">✎</button>

    </div>
  </li>`;
}

function renderObjTaskItem(initId, objId, t) {

  const statusCls = {'not-started':'ts-ns','in-progress':'ts-ip','blocked':'ts-bl','complete':'ts-dn'}[t.status]||'';
  const prioCls = {'high':'prio-high','medium':'prio-med','low':'prio-low'}[t.priority]||'';

  return `<li class="task-item">
    <div class="task-check ${isDone?'ck':''}" onclick="toggleObjTask('${initId}','${objId}','${t.id}')"></div>
    <div class="task-body">

        ${t.priority ? `<span class="${prioCls}">${t.priority}</span>` : ''}
        ${t.due ? `<span style="font-size:11px;color:var(--text-3)">${t.due}</span>` : ''}

    </div>
    <div class="task-actions">
      <button class="icon-btn" onclick="editObjTask('${initId}','${objId}','${t.id}')" title="Edit">✎</button>

    </div>
  </li>`;
}

function renderObjRiskItem(initId, objId, r) {

function renderAssistant() {
  const el = document.getElementById('view-assistant');
  const msgs = S.chat.messages;
  el.innerHTML = `
  <div class="chat-wrap">
    <div class="chat-hd">
      <div class="chat-title">AI Assistant</div>
      <div class="chat-sub">Powered by Claude · Ask anything about the Technology Lifecycle Program</div>
    </div>
    <div class="chat-msgs" id="chat-msgs">
      ${msgs.length === 0 ? `
        <div class="chat-empty">
          <div class="ce-title">What do you need to know?</div>
          <div class="ce-sub">Ask about priorities, risks, decisions, next steps — or anything about the TLP.</div>
          <div class="starters">
            ${['What should I focus on this week?','What are the biggest risks right now?','Summarize Q2 progress','What decisions still need to be made?','What is blocking us?','How is Zipped progressing?','Give me a status update I can share with Dave','What tasks are overdue or blocked?'].map(q =>
              `<div class="starter" onclick="sendStarter(this.textContent)">${q}</div>`).join('')}
          </div>
        </div>` : msgs.map(renderMsg).join('')}
    </div>
    <div class="chat-bar">
      <textarea class="chat-input" id="chat-input" placeholder="Ask anything about the Technology Lifecycle Program…" rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}"></textarea>
      <button class="chat-send" id="chat-send-btn" onclick="sendChat()">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2 14L14 8 2 2v4.5l8 1.5-8 1.5V14z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>`;
  // auto-resize textarea
  const ta = document.getElementById('chat-input');
  if (ta) ta.addEventListener('input', () => { ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,110)+'px'; });
}

function renderMsg(m) {
  return `<div class="msg ${m.role}">
    <div class="msg-av">${m.role==='user'?'JJ':'AI'}</div>
    <div class="msg-bub">${m.role==='assistant' ? md(m.content) : esc(m.content).replace(/\n/g,'<br>')}</div>
  </div>`;
}

function sendStarter(text) {
  document.getElementById('chat-input').value = text;
  sendChat();
}

async function sendChat() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  if (!S.settings.apiKey) { toast('Add your Anthropic API key in Settings first.', 'err'); navigate('settings'); return; }

  input.value = '';
  input.style.height = 'auto';

  S.chat.messages.push({role:'user', content: text});
  saveState();

  // Add user bubble + typing indicator
  const msgsEl = document.getElementById('chat-msgs');
  if (msgsEl) {
    if (msgsEl.querySelector('.chat-empty')) msgsEl.innerHTML = '';
    msgsEl.innerHTML += renderMsg({role:'user', content:text});
    msgsEl.innerHTML += `<div class="msg assistant" id="typing-ind">
      <div class="msg-av">AI</div>
      <div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div>
    </div>`;
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  const btn = document.getElementById('chat-send-btn');
  if (btn) btn.disabled = true;

  try {
    const reply = await callClaude(

function handleFileUpload(input) {
  const f = input.files[0];
  if (f) processFile(f);
}

function processFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const raw = e.target.result;
    const text = file.name.endsWith('.vtt') ? stripVTT(raw) : raw;
    const tx = {
      id: genId(),
      name: file.name,
      date: new Date().toLocaleDateString(),
      lines: text.split('\n').filter(l => l.trim()).length,
      content: text,
      extracted: null
    };
    S.transcripts.unshift(tx);
    saveState();
    renderTranscripts();
    toast('Transcript uploaded: ' + file.name);
  };
  reader.readAsText(file);
}

function stripVTT(content) {
  return content
    .replace(/^WEBVTT[\s\S]*?\n\n/, '')
    .replace(/^\d{2}:\d{2}:\d{2}\.\d{3}\s*-->\s*\d{2}:\d{2}:\d{2}\.\d{3}.*$/gm, '')
    .replace(/^\s*\d+\s*$/gm, '')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

async function analyzeTx(txId) {
  const tx = S.transcripts.find(t => t.id === txId);
  if (!tx || !S.settings.apiKey) return;

  const btn = document.querySelector(`#tx-${txId} .btn-accent`);
  if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Analyzing…'; }

  const prompt = `Analyze this meeting transcript and extract:
1. ACTION ITEMS / TASKS: specific things people committed to do (with owner if mentioned)
2. DECISIONS: concrete decisions that were made
3. RISKS / CONCERNS: issues, blockers, or risks mentioned

Format your response as JSON exactly like this:
{"tasks":["task1","task2"],"decisions":["decision1"],"risks":["risk1"]}

Only include real, actionable items. Here is the transcript:

${tx.content.substring(0, 6000)}`;

  try {
    const reply = await callClaude([{role:'user',content:prompt}], 'You are a meeting notes analyst. Extract structured data from transcripts. Always respond with valid JSON only.');
    const jsonMatch = reply.match(/\{[\s\S]*\}/);
    if (jsonMatch) {
      tx.extracted = JSON.parse(jsonMatch[0]);
      saveState();
      renderTranscripts();
      toast('Analysis complete!');
    }
  } catch(e) {
    toast('Analysis error: ' + e.message, 'err');
    if (btn) { btn.disabled = false; btn.textContent = 'Analyze with AI'; }
  }
}

function addExtractedItem(txId, type, idx) {
  const tx = S.transcripts.find(t => t.id === txId);
  if (!tx || !tx.extracted) return;
  const itemText = tx.extracted[type + 's']?.[idx];
  if (!itemText) return;
  const selEl = document.getElementById(`add-sel-${txId}-${type}-${idx}`);
  const initId = selEl ? selEl.value : 'sbo';
  const init = S.initiatives[initId];
  if (!init) return;

  if (type === 'task') {
    init.tasks.push({id:genId(), text:itemText, owner:'', due:'', status:'not-started', priority:'medium'});
    toast('Task added to ' + init.name.split(' ').slice(0,3).join(' '));
  } else if (type === 'decision') {
    init.decisions.unshift({id:genId(), text:itemText, date:new Date().toISOString().slice(0,10)});
    toast('Decision added.');
  } else if (type === 'risk') {
    init.risks.push({id:genId(), title:itemText.substring(0,60), desc:itemText, likelihood:'medium', impact:'medium', mitigation:''});
    toast('Risk added.');
  }
  saveState();
}

function deleteTx(id) {
  S.transcripts = S.transcripts.filter(t => t.id !== id);
  saveState();
  renderTranscripts();
  toast('Transcript removed.');
}

async function callClaude(messages, systemPrompt) {
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': S.settings.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: S.settings.model || 'claude-sonnet-4-6',
      max_tokens: 4096,
      system: systemPrompt,
      messages
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error?.message || `HTTP ${resp.status}`);
  }
  const data = await resp.json();
  return data.content[0].text;
}

function buildSystemPrompt() {
  const today = new Date().toLocaleDateString('en-US', {weekday:'long',year:'numeric',month:'long',day:'numeric'});
  const initSummary = Object.values(S.initiatives).map(i => {
    const aTasks = allObjTasks(i);
    const openTasks = aTasks.filter(t => t.status !== 'complete');
    const aRisks = allObjRisks(i);
    const highRisks = aRisks.filter(r => r.impact === 'high');
    const aDecisions = allObjDecisions(i);
    return `## ${i.name}
Status: ${i.status} | Progress: ${i.progress}% | Owner: ${i.owners.join(', ')}
Description: ${i.description}
Objectives: ${i.objectives.map(o=>`"${o.text}" (${o.complete?'complete':'open'}, ${(o.tasks||[]).length} tasks, ${(o.risks||[]).length} risks)`).join('; ')}
Open High-Priority Tasks: ${aTasks.filter(t=>t.priority==='high'&&t.status!=='complete').map(t=>`"${t.text}" (${t.status}, owner: ${t.owner})`).join('; ') || 'none'}
All Open Tasks (${openTasks.length}): ${openTasks.map(t=>`"${t.text}" [${t.status}/${t.priority}]`).join('; ')}
High-Impact Risks: ${highRisks.map(r=>`"${r.title}" — ${r.desc}`).join('; ') || 'none'}
Recent Decisions: ${aDecisions.slice(0,3).map(d=>`"${d.text}" (${d.date})`).join('; ')}
Notes: ${i.notes}`;
  }).join('\n\n');

  return `You are an AI assistant for Jordan "JoJo" Jones, a Program Manager at BambooHR managing the Technology Lifecycle Program (TLP). Today is ${today}.

The TLP is a Q2 2026 program with three active initiatives. You have full context on all of them. Be direct, specific, and practical. When giving priorities or recommendations, reference actual tasks and risks by name. Keep responses concise unless asked for detail.

KEY ACRONYMS: TLP = Technology Lifecycle Program | SBO = System Business Owner | PIR = Platform Integration Review | ESC = Enterprise Software Committee

TEAM: JoJo Jones (program lead), Jessi Duffin (team member), Melissa Boud (team member), Dave Petersen (VP/exec sponsor), Alan Roper (finance), Fadi (system architect/IT), Ryan Packer (leadership)

${initSummary}`;
}

function statusBadge(status) {
  const map = {
    'on-track': ['b-green','On Track'],
    'at-risk': ['b-amber','At Risk'],
    'blocked': ['b-red','Blocked'],
    'complete': ['b-blue','Complete']
  };
  const [cls, label] = map[status] || ['b-gray', status];
  return `<span class="badge ${cls}"><span class="badge-dot"></span>${label}</span>`;

function statusColor(status) {
  return {
    'on-track':'var(--green)',
    'at-risk':'var(--amber)',
    'blocked':'var(--red)',
    'complete':'var(--blue)'
  }[status] || 'var(--text-3)';
}

function progressClass(status) {
  return {'on-track':'pf-green','at-risk':'pf-amber','blocked':'pf-red','complete':'pf-blue'}[status]||'pf-accent';
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function genId() {
  return Math.random().toString(36).slice(2,10);
}

function allObjTasks(init) {
  return init.objectives.flatMap(o => (o.tasks||[]).map(t => ({...t, objId:o.id, objText:o.text})));
}
function allObjRisks(init) {
  return init.objectives.flatMap(o => (o.risks||[]).map(r => ({...r, objId:o.id, objText:o.text})));
}
function allObjDecisions(init) {
  return init.objectives.flatMap(o => (o.decisions||[]).map(d => ({...d, objId:o.id, objText:o.text})));
}

// Simple markdown renderer
function md(text) {
  if (!text) return '';
  let t = text
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/`(.+?)`/g,'<code>$1</code>');
  // Headers
  t = t.replace(/^### (.+)$/gm,'<h4 style="font-size:13px;font-weight:600;margin:8px 0 4px">$1</h4>');
  t = t.replace(/^## (.+)$/gm,'<h3 style="font-size:14px;font-weight:600;margin:10px 0 5px">$1</h3>');
  t = t.replace(/^# (.+)$/gm,'<h2 style="font-size:15px;font-weight:700;margin:12px 0 6px">$1</h2>');
  // Lists
  t = t.replace(/^[-•] (.+)$/gm,'<li>$1</li>');
  t = t.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  t = t.replace(/(<li>.*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
  // Paragraphs
  t = t.replace(/\n\n/g,'</p><p>');
  t = `<p>${t}</p>`;
  t = t.replace(/<p>(<[hul])/g,'$1').replace(/(<\/[hul][^>]*>)<\/p>/g,'$1');
  t = t.replace(/<p><\/p>/g,'');
  return t;
}

// ============================================================
// 13. GLOBAL SEARCH
// ============================================================
function initSearch() {
  const input = document.getElementById('global-search');
  const resultsEl = document.getElementById('search-results');
  if (!input || !resultsEl) return;

  input.addEventListener('input', () => {
    const q = input.value.trim().toLowerCase();
    if (q.length < 2) { resultsEl.classList.remove('open'); return; }
    const results = searchAll(q);
    if (!results.length) {
      resultsEl.innerHTML = '<div class="search-empty">No results found</div>';
    } else {
      resultsEl.innerHTML = results.slice(0, 10).map(r => `
        <div class="search-result" onclick="goToSearchResult('${r.initId}','${r.objId||''}');document.getElementById('global-search').value='';document.getElementById('search-results').classList.remove('open')">
          <div class="search-result-text">${highlightMatch(esc(r.text), q)}</div>
          <div class="search-result-meta">
            <span class="search-result-type">${r.type}</span>
            <span>${esc(r.initName)}</span>
          </div>
        </div>`).join('');
    }
    resultsEl.classList.add('open');
  });

  input.addEventListener('blur', () => {
    setTimeout(() => resultsEl.classList.remove('open'), 200);
  });
  input.addEventListener('focus', () => {
    if (input.value.trim().length >= 2) resultsEl.classList.add('open');
  });
}

function searchAll(query) {
  const results = [];
  Object.values(S.initiatives).forEach(i => {
    const initName = i.name.split(' ').slice(0,2).join(' ');
    i.objectives.forEach(o => {
      const objLabel = o.text.substring(0,30) + (o.text.length>30?'…':'');
      if (o.text.toLowerCase().includes(query)) {
        results.push({type:'Objective', text:o.text, initId:i.id, objId:o.id, initName});
      }
      (o.tasks||[]).forEach(t => {
        if (t.text.toLowerCase().includes(query)) {
          results.push({type:'Task', text:t.text, initId:i.id, objId:o.id, initName: initName + ' › ' + objLabel});
        }
      });
      (o.risks||[]).forEach(r => {
        if (r.title.toLowerCase().includes(query) || r.desc.toLowerCase().includes(query)) {
          results.push({type:'Risk', text:r.title, initId:i.id, objId:o.id, initName: initName + ' › ' + objLabel});
        }
      });
      (o.decisions||[]).forEach(d => {
        if (d.text.toLowerCase().includes(query)) {
          results.push({type:'Decision', text:d.text, initId:i.id, objId:o.id, initName: initName + ' › ' + objLabel});
        }
      });
    });
    if (i.notes && i.notes.toLowerCase().includes(query)) {
      const idx = i.notes.toLowerCase().indexOf(query);
      const start = Math.max(0, idx - 30);
      const snippet = (start > 0 ? '…' : '') + i.notes.substring(start, idx + query.length + 50) + (idx + query.length + 50 < i.notes.length ? '…' : '');
      results.push({type:'Note', text:snippet, initId:i.id, initName});
    }
  });
  return results;
}

function highlightMatch(text, query) {
  const idx = text.toLowerCase().indexOf(query);
  if (idx === -1) return text;
  return text.substring(0, idx) + '<strong style="color:var(--accent)">' + text.substring(idx, idx + query.length) + '</strong>' + text.substring(idx + query.length);
}

function goToSearchResult(initId, objId) {
  if (objId) {
    navigate(initId);
    viewObjective(initId, objId);
  } else {
    S.ui.objectiveView = null;
    navigate(initId);
  }
}

// ============================================================
// 14. INIT
// ============================================================
loadState();
// Wire up nav clicks
document.querySelectorAll('.nav-item[data-view]').forEach(btn => {
  btn.addEventListener('click', () => navigate(btn.dataset.view));
});
// Wire up global search
initSearch();
// Render initial view
navigate(S.ui.currentView || 'dashboard');
</script>
